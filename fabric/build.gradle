plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = "$rootProject.mod_name-$rootProject.minecraft_version-fabric"
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    mixin {
        add sourceSets.main, 'dwm.refmap.json'
    }

    runs {
        datagen {
            inherit client
            name 'Data Generation'
            runDir 'run'

            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('../common/src/main/generated')}"
            vmArg '-Dfabric-api.datagen.strict-validation'

            ideConfigGenerated = true
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version+$rootProject.minecraft_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    if (rootProject.hasProperty('forge_config_api_port_version')) {
        modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$rootProject.forge_config_api_port_version"
    }

    if (rootProject.hasProperty('dim_lib_version')) {
        modCompileOnlyApi("com.github.iPortalTeam:DimLib:v$rootProject.dim_lib_version") {
            exclude(group: 'net.fabricmc.fabric-api')
            transitive(false)
        }
    }

    if (rootProject.hasProperty('imm_ptl_version')) {
        modCompileOnlyApi("com.github.iPortalTeam:ImmersivePortalsMod:v$rootProject.imm_ptl_version") {
            exclude(group: 'net.fabricmc.fabric-api')
            transitive(false)
        }
    }

    if (rootProject.hasProperty('cloth_config_version')) {
        modCompileOnlyApi("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
            exclude(group: 'net.fabricmc.fabric-api')
            transitive(false)
        }
    }

    if (rootProject.hasProperty('mod_menu_version')) {
        modCompileOnlyApi("com.terraformersmc:modmenu:$rootProject.mod_menu_version") {
            exclude(group: 'net.fabricmc.fabric-api')
            transitive(false)
        }
    }

    if (rootProject.hasProperty('teamreborn_energy_api_version')) {
        modCompileOnlyApi("teamreborn:energy:$rootProject.teamreborn_energy_api_version") {
            exclude(group: 'net.fabricmc.fabric-api')
            transitive(false)
        }
    }

    if (rootProject.hasProperty('ae2_api_version')) {
        modCompileOnlyApi("appeng:appliedenergistics2-fabric:$rootProject.ae2_api_version:api") {
            exclude(group: 'net.fabricmc.fabric-api')
            transitive(false)
        }
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.properties rootProject.ext.attrs

    filesMatching('fabric.mod.json') {
        expand rootProject.ext.attrs
    }
}

shadowJar {
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from commonSources.archiveFile.map { zipTree(it) }
}
