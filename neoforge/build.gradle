plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

base {
    archivesName = "$rootProject.mod_name-$rootProject.minecraft_version-neoforge"
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.neoforged.net/releases' }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    if (rootProject.hasProperty('forge_config_api_port_version')) {
        modApi "fuzs.forgeconfigapiport:forgeconfigapiport-neoforge:$rootProject.forge_config_api_port_version"
    }

    if (rootProject.hasProperty('cloth_config_version')) {
        modCompileOnlyApi("me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version") {
            transitive(false)
        }
    }

    if (rootProject.hasProperty('ae2_api_version')) {
        modCompileOnlyApi("appeng:appliedenergistics2-neoforge:$rootProject.ae2_api_version:api") {
            transitive(false)
        }
    }

    if (rootProject.hasProperty('iris_version')) {
        modCompileOnlyApi("maven.modrinth:iris:$rootProject.iris_version+$rootProject.minecraft_version-neoforge") {
            transitive(false)
        }
    }

    // Immersive Portals NeoForge jar cannot be remapped by Loom; ImmersivePortalsUtilsImpl uses reflection.

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.properties rootProject.ext.attrs

    filesMatching('META-INF/neoforge.mods.toml') {
        expand rootProject.ext.attrs
    }
}

shadowJar {
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    injectAccessWidener = true
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from commonSources.archiveFile.map { zipTree(it) }
}
